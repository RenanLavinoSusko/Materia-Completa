<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../imagens/icon-materiacompleta.png" type="image/x-icon">
    <title>Matéria Completa</title>
    <link rel="stylesheet" href="biologia.css">
</head>
<body>
    
        <header>
            <!--Topo pagina-->
            <h1>matéria completa</h1>
            <button type="button"><img src="../../imagens/doacao.png"></button>
        </header>

        <div class="container">
            <main>
                <!--Biologia A-->
                <input type="radio" name="materia" id="A" checked>
                <label for="A">Biologia A</label>

                <div id="materia_A">
                    <input type="radio" name="ano" id="an1A">
                    <label for="an1A">1º Ano</label>
                    <!--1 Ano-->
                    <div id="ano1A">
                        <!--1 Trimestre-->
                        <input type="radio" name="conteudo" id="CC">
                        <label for="CC">Composição Química da Célula</label>
                        <input type="radio" name="conteudo" id="PE">
                        <label for="PE">Proteínas e Enzimas</label>
                        <input type="radio" name="conteudo" id="AR">
                        <label for="AR">Ácidos nucleicos, replicação e transcrição</label>
                        <input type="radio" name="conteudo" id="IC">
                        <label for="IC">Introdução à Citologia</label>
                        <input type="radio" name="conteudo" id="EC">
                        <label for="EC">Envoltórios Celulares</label>
                        <input type="radio" name="conteudo" id="Cit">
                        <label for="Cit">Citoplasma</label>

                        <!--2 Trimestre-->
                        <input type="radio" name="conteudo" id="FQ">
                        <label for="FQ">Fotossíntese e Quimiossíntese</label>
                        <input type="radio" name="conteudo" id="RF">
                        <label for="RF">Respiração e Fermentação</label>
                        <input type="radio" name="conteudo" id="NC">
                        <label for="NC">Núcleo Celular</label>
                        <input type="radio" name="conteudo" id="SP">
                        <label for="SP">Síntese Proteica</label>
                        <input type="radio" name="conteudo" id="CM">
                        <label for="CM">Ciclo Celular: Mitose e Meiose</label>
                        <input type="radio" name="conteudo" id="GM">
                        <label for="GM">Gametogênese Masculina e Feminina</label>
                    </div>

                    <input type="radio" name="ano" id="an2A">
                    <label for="an2A">2º Ano</label>
                    <!--2 Ano-->
                    <div id="ano2A">

                    </div>

                    <input type="radio" name="ano" id="an3A">
                    <label for="an3A">3º Ano</label>
                    <!--3 Ano-->
                    <div id="ano3A">

                    </div>

                </div>

                <!--Biologia B-->
                <input type="radio" name="materia" id="B">
                <label for="B">Biologia B</label>
                
                    <div id="materia_B">
                        <input type="radio" name="ano" id="an1B">
                        <label for="an1B">1º Ano</label>
                        <!--1 Ano-->
                        <div id="ano1B">
                            <!--1 Trimestre-->                    
                            <input type="radio" name="conteudo" id="IC">
                            <label for="IC">Introdução à Biologia e ao Método Científico</label>    
                            <input type="radio" name="conteudo" id="CV">
                            <label for="CV">Características dos Seres Vivos e Origem da Vida</label>
                            <input type="radio" name="conteudo" id="EB">
                            <label for="EB">Evidências da Evolução Biológica</label>    
                            <input type="radio" name="conteudo" id="TE">
                            <label for="TE">Teorias Evolucionistas</label>    
                            <input type="radio" name="conteudo" id="FE">
                            <label for="FE">Formações de Novas Espécies</label>

                            <!--2 Trimestre-->
                            <input type="radio" name="conteudo" id="CE">
                            <label for="CE">Conceitos Fundamentais da Ecologia</label>
                            <input type="radio" name="conteudo" id="FL">
                            <label for="FL">Fluxo de Energia</label>
                            <input type="radio" name="conteudo" id="CB">
                            <label for="CB">Ciclos Biogeoquímicos</label>
                            <input type="radio" name="conteudo" id="RE">
                            <label for="RE">Relações Ecológicas</label>
                            <input type="radio" name="conteudo" id="DP">
                            <label for="DP">Dinâmica Populacional</label>
                            <input type="radio" name="conteudo" id="SE">
                            <label for="SE">Sucessão Ecológica</label>
                            <input type="radio" name="conteudo" id="AA">
                            <label for="AA">Alterações Ambientais</label>
                        </div>

                        <input type="radio" name="ano" id="an2B">
                        <label for="an2B">2º Ano</label>
                        <!--2 Ano-->
                        <div id="ano2B">

                        </div>

                        <input type="radio" name="ano" id="an3B">
                        <label for="an3B">3º Ano</label>
                        <div id="ano3B">

                        </div>
                </div>
            </main>

        <div id="quadro"></div>

    </div>

    <script src="logica.js"></script>
    <script src="dados-biologia.js"></script>
</body>
</html>
