<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../imagens/icon-materiacompleta.png" type="image/x-icon">
    <title>Matéria Completa</title>
    <link rel="stylesheet" href="artes.css">
</head>
<body>
    
        <header>
            <!--Topo pagina-->
            <h1>matéria completa</h1>
            <button type="button"><img src="../../imagens/doacao.png"></button>
        </header>

        <div class="container">
            <main>
                <input type="radio" name="ano" id="an1">
                <label for="an1">1º Ano</label>
                <!--1 Ano-->
                <div id="ano1">
                    <!--1 Semestre-->
                    <input type="radio" name="semestre" id="sem11">
                    <label for="sem11">1º Semestre</label>
                    <div id="se11">
                        <section>    
                            <input type="radio" name="conteudo" id="EA">
                            <label for="EA">Para Entender a Arte</label>
                            <input type="radio" name="conteudo" id="PA">
                            <label for="PA">Pré-História da Arte</label>
                            <input type="radio" name="conteudo" id="AU">
                            <label for="AU">Antiguidade não é Ultrapassada</label>
                            <input type="radio" name="conteudo" id="LG">
                            <label for="LG">Ligações Greco-Romanas</label>
                            <input type="radio" name="conteudo" id="CTMMBI">
                            <label for="CTMMBI">Comédia, Tragédia, Máscaras e Marionetes</label>
                            <input type="radio" name="conteudo" id="BI">
                            <label for="BI">Arte Bizantina e Arte Islâmica</label>
                            <input type="radio" name="conteudo" id="TI">
                            <label for="TI">Nem Tudo são Trevas na Idade Média</label>
                        </section>
                    </div>

                    <!--2 Semestre-->
                    <input type="radio" name="semestre" id="sem12">
                    <label for="sem12">2º Semestre</label>
                    <div id="se12">
                        <section>
                            <input type="radio" name="conteudo" id="PPOM">
                            <label for="PPOM">Do Pova Para o Povo</label>
                            <input type="radio" name="conteudo" id="OM">
                            <label for="OM">Ocidente Também é de Outro Mundo</label>
                            <input type="radio" name="conteudo" id="VP">
                            <label for="VP">Velhos Padrões Renascem</label>
                            <input type="radio" name="conteudo" id="PR">
                            <label for="PR">Perspectivas Renascentista</label>
                            <input type="radio" name="conteudo" id="CD">
                            <label for="CD">Mundo Cheio de Curvas Dramáticas</label>
                            <input type="radio" name="conteudo" id="BP">
                            <label for="BP">Barroco de Personalidade</label>
                            <input type="radio" name="conteudo" id="MD">
                            <label for="MD">O Mundo Precisa se Divertir</label>
                        </section>
                    </div>
                </div>

                <input type="radio" name="ano" id="an2">
                <label for="an2">2º Ano</label>
                <!--2 Ano-->
                <div id="ano2">
                    <input type="radio" name="semestre" id="sem21">
                    <label for="sem21">1º Semestre</label>
                    <div id="se21">

                    </div>   

                    <input type="radio" name="semestre" id="sem22">
                    <label for="sem22">2º Semestre</label>
                    <div id="se22">
                    </div>
                </div>

                <input type="radio" name="ano" id="an3">
                <label for="an3">3º Ano</label>
                <!--3 Ano-->
                <div id="ano3">
                    <input type="radio" name="semestre" id="sem31">
                    <label for="sem31">1º Semestre</label>
                    <div id="se31">

                    </div>

                    <input type="radio" name="semestre" id="sem32">
                    <label for="sem32">2º Semestre</label>
                    <div id="se32">

                    </div>
                </div>
            </main>

        <div id="quadro"></div>

    </div>

    <script src="logica.js"></script>
    <script src="dados-artes.js"></script>
</body>
</html>
