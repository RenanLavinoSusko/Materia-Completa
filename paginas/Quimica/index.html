<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../imagens/icon-materiacompleta.png" type="image/x-icon">
    <title>Matéria Completa</title>
    <link rel="stylesheet" href="quimica.css">
</head>
<body>
    
        <header>
            <!--Topo pagina-->
            <h1>matéria completa</h1>
            <button type="button"><img src="../../imagens/doacao.png"></button>
        </header>

        <div class="container">
            <main>
                <!--Qumica A-->
                <input type="radio" name="materia" id="A" checked>
                <label for="A">Química A</label>

                <div id="materia_A">
                    <input type="radio" name="ano" id="an1A">
                    <label for="an1A">1º Ano</label>
                    <!--1 Ano-->
                    <div id="ano1A">
                        <!--1 Trimestre-->
                        <input type="radio" name="conteudo" id="ASM">
                        <label for="ASM">Átomo, Substancias e Misturas</label>
                        <input type="radio" name="conteudo" id="PM">
                        <label for="PM">Propriedades da Matéria</label>
                        <input type="radio" name="conteudo" id="Mis">
                        <label for="Mis">Misturas</label>
                        <input type="radio" name="conteudo" id="MA">
                        <label for="MA">Massa atômica, Molecular e Molar</label>
                        <input type="radio" name="conteudo" id="FQ">
                        <label for="FQ">Fórmulas Químicas</label>
                        <input type="radio" name="conteudo" id="PA">
                        <label for="PA">Princípio de Avogadro</label>

                        <!--2 Trimestre-->
                        <input type="radio" name="conteudo" id="LP">
                        <label for="LP">Leis Ponderais</label>
                        <input type="radio" name="conteudo" id="CE">
                        <label for="CE">Cálculo Estequiométrico</label>
                        <input type="radio" name="conteudo" id="PG">
                        <label for="PG">Propriedades dos Gases</label>
                        <input type="radio" name="conteudo" id="TG">
                        <label for="TG">Transformações Gasosas</label>
                        <input type="radio" name="conteudo" id="EG">
                        <label for="EG">Equação Geral dos Gases</label>
                        <input type="radio" name="conteudo" id="MG">
                        <label for="MG">Misturas Gasosas</label>
                    </div>

                    <input type="radio" name="ano" id="an2A">
                    <label for="an2A">2º Ano</label>
                    <!--2 Ano-->
                    <div id="ano2A">

                    </div>

                    <input type="radio" name="ano" id="an3A">
                    <label for="an3A">3º Ano</label>
                    <!--3 Ano-->
                    <div id="ano3A">

                    </div>

                </div>

                <!--Quimica B-->
                <input type="radio" name="materia" id="B">
                <label for="B">Química B</label>
                
                    <div id="materia_B">
                        <input type="radio" name="ano" id="an1B">
                        <label for="an1B">1º Ano</label>
                        <!--1 Ano-->
                        <div id="ano1B">
                            <!--1 Trimestre-->                    
                            <input type="radio" name="conteudo" id="EM">
                            <label for="EM">Estrutura da Matéria</label>    
                            <input type="radio" name="conteudo" id="AI">
                            <label for="AI">Atômos e Íons</label>
                            <input type="radio" name="conteudo" id="EA">
                            <label for="EA">Eletrosfera dos Atômos</label>    
                            <input type="radio" name="conteudo" id="TP">
                            <label for="TP">Tabela Periódica</label>    
                            <input type="radio" name="conteudo" id="OT">
                            <label for="OT">Organização da Tabela</label>    
                            <input type="radio" name="conteudo" id="PP">
                            <label for="PP">Propriedades Periódicas</label>

                            <!--2 Trimestre-->
                            <input type="radio" name="conteudo" id="LI">
                            <label for="LI">Ligação Iônica</label>
                            <input type="radio" name="conteudo" id="LC">
                            <label for="LC">Ligação Covalente</label>
                            <input type="radio" name="conteudo" id="LM">
                            <label for="LM">Ligação Metálica</label>
                            <input type="radio" name="conteudo" id="GM">
                            <label for="GM">Geometria Molecular</label>
                            <input type="radio" name="conteudo" id="PL">
                            <label for="PL">Polaridade das Ligações</label>
                            <input type="radio" name="conteudo" id="FI">
                            <label for="FI">Forças Intermoleculares</label>
                        </div>

                        <input type="radio" name="ano" id="an2B">
                        <label for="an2B">2º Ano</label>
                        <!--2 Ano-->
                        <div id="ano2B">

                        </div>

                        <input type="radio" name="ano" id="an3B">
                        <label for="an3B">3º Ano</label>
                        <div id="ano3B">

                        </div>
                </div>
            </main>

        <div id="quadro"></div>

    </div>

    <script src="quimica.js"></script>
    <script src="dados-quimica.js"></script>
</body>
</html>
