<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../imagens/icon1branco-materiacompleta (1).png" type="image/x-icon">
    <title>Matéria Completa</title>
    <link rel="stylesheet" href="quimica.css">
</head>
<body>
    
        <header>
            <!--Topo pagina-->
            <h1>matéria completa</h1>
            <a href=""><img src="../../imagens/doacao.png"></a>
        </header>

        <div class="container">
            <main>
                <!--Qumica A-->
                <input type="radio" name="materia" id="A" checked></input>
                <label for="A">Química A</label>

                <div id="materia_A">
                    <input type="radio" name="conteudo" id="ASM">
                    <label for="ASM">Átomo, Substancias e Misturas</label>
                    <input type="radio" name="conteudo" id="PM">
                    <label for="PM">Propriedades da Matéria</label>
                    <input type="radio" name="conteudo" id="Mis">
                    <label for="Mis">Misturas</label>
                    <input type="radio" name="conteudo" id="MA">
                    <label for="MA">Massa Atômica</label>
                    <input type="radio" name="conteudo" id="FM">
                    <label for="FM">Fórmulas Químicas</label>
                    <input type="radio" name="conteudo" id="PA">
                    <label for="PA">Princípio de Avogadro</label>
                </div>

                <!--Quimica B-->
                <input type="radio" name="materia" id="B">
                <label for="B">Química B</label>

                <div id="materia_B">

                </div>
            </main>

        <div id="quadro"></div>

    </div>

    <script src="conteudos.js"></script>
    <script src="materia.js"></script>
</body>
</html>
